<svg xmlns="http://www.w3.org/2000/svg" width="376" height="225" viewBox="0 0 376 225" role="img" aria-label="An infinity symbol rendered as animated ASCII art by ascii-animator">
<style>
  .r {
    font: 500 12px ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    fill: #6e8fff; opacity: 0; white-space: pre;
    animation: riseIn .7s ease forwards, shimmer 4.5s ease-in-out infinite;
  }
  .cap { font: 500 10px ui-monospace, Menlo, Consolas, monospace; fill: #8b949e; letter-spacing: 2px; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes shimmer { 0%,100% { fill: #6e8fff; } 50% { fill: #b8a8ff; } }
</style>
<rect width="100%" height="100%" rx="10" fill="#0d1117"/>
