name: generate contribution snake

on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch:        # lets you run it on demand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: generate the snake SVG from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # themed to match the profile: blue snake, dark→blue contribution dots
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#6e8fff&color_dots=#0b0d12,#1c2233,#39476e,#5a6fb0,#6e8fff

      - name: publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
